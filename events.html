<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-57LGQFRM4Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-57LGQFRM4Y');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Shipwreck City</title>
  <meta name="description" content="Upcoming talks, lectures, and public events from the Shipwreck City project.">
  <meta property="og:title" content="Shipwreck City | Mapping Seattle's Sunken Fleet">
  <meta property="og:description" content="Underwater robots are mapping 100+ wreck and debris sites beneath Seattle's most-visited lake — and publishing everything for free at ShipwreckCity.org.">
  <meta property="og:image" content="https://shipwreckcity.org/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shipwreckcity.org">
  <link rel="icon" type="image/png" href="img/thumbnails/favicon_sc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=block">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .events-list { display: flex; flex-direction: column; gap: 24px; }
    .event-card {
      display: flex;
      gap: 28px;
      padding: 32px;
      border: 1px solid var(--border-mid);
      background: var(--bg-card);
      align-items: flex-start;
    }
    .event-photo {
      flex: 0 0 260px;
      align-self: stretch;
      overflow: hidden;
    }
    .event-photo img {
      width: 100%; height: 100%; aspect-ratio: 2 / 3;
      object-fit: cover; display: block;
      filter: brightness(0.95) contrast(1.08) saturate(1.15);
    }
    .event-date-block {
      flex: 0 0 120px;
      text-align: center;
      border-right: 1px solid var(--border-mid);
      padding-right: 24px;
    }
    .event-date-month { font-family: var(--font-body); font-size: 15px; letter-spacing: 2px; color: var(--accent); }
    .event-date-day   { font-family: var(--font-display); font-size: 52px; color: var(--text-primary); line-height: 1; margin: 4px 0; }
    .event-date-year  { font-family: var(--font-body); font-size: 15px; color: var(--text-muted); }
    .event-body  { flex: 1; }
    .event-title { font-family: var(--font-display); font-size: 30px; letter-spacing: 1px; color: var(--text-primary); line-height: 1.15; margin-bottom: 10px; }
    .event-badge {
      display: inline-block; font-family: var(--font-body); font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; color: #d99456; border: 1px solid #5a3f1a; background: rgba(217,148,86,0.08);
      padding: 3px 10px; margin: 0 8px 12px 0;
    }
    .event-time  { font-family: var(--font-display); font-size: 24px; letter-spacing: 1px; color: var(--accent); margin-bottom: 6px; }
    .event-meta  { font-family: var(--font-body); font-size: 15px; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 16px; }
    .event-desc  { font-family: var(--font-serif); font-size: 16px; color: var(--text-mid); line-height: 1.8; margin-bottom: 22px; }
    .events-empty {
      font-family: var(--font-serif); font-style: italic; font-size: 16px;
      color: var(--text-muted); text-align: center; padding: 48px 0;
    }
    .recap-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .recap-tile {
      margin: 0;
      background: var(--bg-deep);
      overflow: hidden;
    }
    .recap-tile img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      filter: brightness(0.85);
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .recap-tile:hover img {
      filter: brightness(1);
      transform: scale(1.03);
    }
    .recap-tile figcaption {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 10px;
      line-height: 1.5;
    }
    @media (max-width: 800px) {
      .recap-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .event-card { flex-direction: column; gap: 16px; }
      .event-photo { display: none; }
      .event-date-block { border-right: none; border-bottom: 1px solid var(--border-mid); padding-right: 0; padding-bottom: 16px; width: 100%; }
    }
  </style>
</head>
<body>

<div id="nav-mount"></div>

<div class="page-hero">
  <div class="hero-bg-photo"><img src="img/targets/lu073/primetime.webp" alt="" aria-hidden="true"></div>
  <a class="hero-photo-link" href="lu-archive/lu073" aria-label="View Possible Airplane Drop Tank (LU073) target record"></a>
  <div class="page-hero-grid"></div>
  <div class="page-hero-content">
    <div class="hero-eyebrow">Talks, Lectures &amp; Public Appearances</div>
    <h1 class="page-title">UPCOMING<br>EVENTS</h1>
    <p class="page-sub">Where to catch the Shipwreck City team out in the world.</p>
  </div>
</div>

<section class="section container" style="max-width: 1100px;">
  <div class="section-label">Upcoming Events</div>
  <div class="events-list" id="events-list"></div>
</section>

<section class="section container" style="max-width: 1100px; padding-top: 0;">
  <div class="section-label">From the Cascadia Art Museum Lecture</div>
  <div class="recap-grid">
    <figure class="recap-tile">
      <img src="img/events/cascadia_phillibbiestart.webp" alt="Phil Parisi and Libbie Barnes in front of the 'Beneath the Surface' title slide" loading="lazy">
      <figcaption>Opening remarks — "Beneath the Surface," by Phil and Libbie</figcaption>
    </figure>
    <figure class="recap-tile">
      <img src="img/events/cascadia_phil61.webp" alt="Phil Parisi presenting a slide reading 'How many wrecks? 61 and counting...'" loading="lazy">
      <figcaption>61 wrecks documented, and counting</figcaption>
    </figure>
    <figure class="recap-tile">
      <img src="img/events/cascadia_evantable.webp" alt="Evan Weber speaking with attendees at the Shipwreck City info table" loading="lazy">
      <figcaption>Evan discussing the archive with attendees</figcaption>
    </figure>
    <figure class="recap-tile">
      <img src="img/events/cascadia_phillibbie.webp" alt="Phil Parisi and Libbie Barnes in front of a 'Thank you, ShipwreckCity.org' closing slide" loading="lazy">
      <figcaption>"Thank you, ShipwreckCity.org"</figcaption>
    </figure>
  </div>
</section>

<section class="section container" id="previous-events-section" style="max-width: 1100px; padding-top: 0; display: none;">
  <div class="section-label">Previous Events</div>
  <div class="events-list" id="previous-events-list"></div>
</section>

<div class="container" style="padding-top:0; padding-bottom:64px;">
  <div class="cta-block" style="text-align: center;">
    <p>
      Bring Shipwreck City to your event.
    </p>
    <a href="mailto:phil@shipwreckcity.org?subject=Speaking%20Request%20for%20Shipwreck%20City" class="download-btn">Email Phil →</a>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/wrecks-data.js"></script>
<script src="js/events-data.js"></script>
<script src="js/site.js"></script>
<script>
  document.getElementById('nav-mount').innerHTML    = buildNav('events');
  document.getElementById('footer-mount').innerHTML = buildFooter();

  function renderEventCard(e) {
    return `
      <div class="event-card">
        ${e.image ? `<div class="event-photo"${e.imagePosition === 'right' ? ' style="order:3;"' : ''}><img src="${e.image}" alt="${e.title}" loading="lazy"></div>` : ''}
        <div class="event-date-block">
          <div class="event-date-month">${e.month}</div>
          <div class="event-date-day">${e.day}</div>
          <div class="event-date-year">${e.year}</div>
        </div>
        <div class="event-body">
          ${e.badge ? (Array.isArray(e.badge) ? e.badge : [e.badge]).map(b => `<div class="event-badge">${b}</div>`).join('') : ''}
          <div class="event-title">${e.title}</div>
          <div class="event-time">${e.time}</div>
          <div class="event-meta">${e.venue}${e.address ? `, ${e.address}` : ''}</div>
          <div class="event-desc">${e.description}</div>
          <a href="${e.url}" target="_blank" rel="noopener" class="download-btn">${e.ctaLabel || 'Learn More →'}</a>
        </div>
      </div>
    `;
  }

  const upcomingEvents = EVENTS.filter(e => !e.past);
  const previousEvents = EVENTS.filter(e => e.past);

  document.getElementById('events-list').innerHTML = upcomingEvents.length
    ? upcomingEvents.map(renderEventCard).join('')
    : `<div class="events-empty">No upcoming events at this time — check back soon.</div>`;

  if (previousEvents.length) {
    document.getElementById('previous-events-list').innerHTML = previousEvents.map(renderEventCard).join('');
    document.getElementById('previous-events-section').style.display = '';
  }
</script>
</body>
</html>
